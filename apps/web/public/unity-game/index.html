<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GENORYX: Genesis</title>
    <style>
      html, body, #unity-canvas { margin: 0; width: 100%; height: 100%; background: #07080c; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #7ee0d6; font-family: Georgia, serif; letter-spacing: 0.18em;
      }
      #boot strong { display: block; color: #d4af37; font-size: 1.6rem; }
    </style>
  </head>
  <body>
    <div id="boot"><div><strong>GENORYX: GENESIS</strong>montando o chassi 3D</div></div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/unity-game.loader.js"></script>
    <script>
      (function () {
        var origin = location.origin;
        var pendingJson = null;
        var host = null;
        var canvas = document.querySelector("#unity-canvas");

        function applyPending() {
          if (!host || !pendingJson) return;
          host.SendMessage("CreaturePreview", "EnterPreview", "");
          host.SendMessage("CreaturePreview", "ApplyDnaJson", pendingJson);
        }

        function tellParent(payload) {
          if (window.parent === window) return;
          window.parent.postMessage(Object.assign({ type: "GENORYX_CHASSIS" }, payload), origin);
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== origin) return;
          if (!event.data || event.data.type !== "GENORYX_CHASSIS") return;
          if (event.data.action === "apply" && typeof event.data.json === "string") {
            pendingJson = event.data.json;
            applyPending();
          }
        });

        if (typeof createUnityInstance !== "function") {
          tellParent({ action: "error", message: "loader sem createUnityInstance" });
          return;
        }

        createUnityInstance(canvas, {
          dataUrl: "Build/unity-game.data.unityweb",
          frameworkUrl: "Build/unity-game.framework.js.unityweb",
          codeUrl: "Build/unity-game.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "GENORYX",
          productName: "GENORYX World",
          productVersion: "chassis-preview-20260905"
        }).then(function (instance) {
          host = instance;
          host.SendMessage("CreaturePreview", "EnterPreview", "");
          applyPending();
          var boot = document.getElementById("boot");
          if (boot) boot.remove();
          tellParent({ action: "ready" });
        }).catch(function (err) {
          tellParent({ action: "error", message: String(err && err.message ? err.message : err) });
        });
      })();
    </script>
  </body>
</html>
