# NEXORA ALPHA no nginx do host.
# 80/443 continuam AURORA / Palworld. Alpha escuta só 8443.

limit_req_zone $binary_remote_addr zone=nexora_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=nexora_matchmake:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=nexora_conn:10m;

server {
  listen 8443 ssl http2;
  listen [::]:8443 ssl http2;
  server_name srv1568762.hstgr.cloud;

  ssl_certificate     /etc/letsencrypt/live/srv1568762.hstgr.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/srv1568762.hstgr.cloud/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 1m;
  limit_conn nexora_conn 32;

  location = /ready {
    default_type application/json;
    return 200 '{"ok":true,"service":"nginx","channel":"alpha"}';
  }

  location /api/ {
    limit_req zone=nexora_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;
  }

  location /colyseus {
    rewrite ^/colyseus$ / break;
    rewrite ^/colyseus/(.*)$ /$1 break;
    limit_req zone=nexora_matchmake burst=10 nodelay;
    proxy_pass http://127.0.0.1:3567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Bundle WebGL do Unity: arquivos de dezenas de MB. Na location "/" o nginx bufferaria
  # a resposta inteira em arquivo temporario antes de repassar, o que atrasa o primeiro
  # byte e gera I/O a cada tester. O conteudo e imutavel por build, entao cacheia longe.
  location /unity-game/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
