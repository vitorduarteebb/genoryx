# HTTP para ACME e redirect. Palworld continua default_server em :80.
# Instalar já: quando o DNS A existir, o certbot usa este webroot.

server {
  listen 80;
  listen [::]:80;
  server_name alpha.genoryx.com.br genoryx.com.br www.genoryx.com.br play.genoryx.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot-genoryx;
  }

  location / {
    return 301 https://alpha.genoryx.com.br$request_uri;
  }
}
