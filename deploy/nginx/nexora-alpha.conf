# NEXORA ALPHA — único ponto público.
# Postgres, Redis, API, game-server e Next ficam atrás desta borda.
# Substitua alpha.nexora.local pelo domínio real.

limit_req_zone $binary_remote_addr zone=nexora_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=nexora_matchmake:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=nexora_conn:10m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream nexora_web {
  server web:3000;
}

upstream nexora_api {
  server api:3001;
}

upstream nexora_game {
  server game-server:2567;
}

server {
  listen 80;
  listen [::]:80;
  server_name alpha.nexora.local;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name alpha.nexora.local;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 1m;
  limit_conn nexora_conn 32;

  location = /ready {
    default_type application/json;
    return 200 '{"ok":true,"service":"nginx","channel":"alpha"}';
  }

  location /api/ {
    limit_req zone=nexora_api burst=20 nodelay;
    proxy_pass http://nexora_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }

  location /colyseus {
    rewrite ^/colyseus$ / break;
    rewrite ^/colyseus/(.*)$ /$1 break;
    limit_req zone=nexora_matchmake burst=10 nodelay;
    proxy_pass http://nexora_game;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://nexora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
